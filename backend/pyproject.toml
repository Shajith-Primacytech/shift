[project]
name = "shift-backend"
version = "0.2.0"
description = "SHIFT persistent knowledge and approval API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.22,<1",
    "httpx>=0.28,<1",
    "llama-index-core>=0.14.25,<0.15",
    "llama-index-embeddings-huggingface>=0.8,<0.9",
    "sentence-transformers>=6.1,<7",
    "numpy>=1.26,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
